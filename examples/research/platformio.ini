[platformio]
default_envs = c6
src_dir = main

[env]
platform = espressif32@8.0.0
platform_packages =
    framework-espidf @ symlink://${platformio.packages_dir}/framework-espidf-v5.5.6
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
framework = espidf
monitor_speed = 115200
build_flags = -std=gnu++20
build_unflags = -std=gnu++2b
extra_scripts = pre:prepare.py

[env:c6]
board = esp32-c6-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

[env:c6_idf61]
extends = env:c6
platform_packages =
    framework-espidf @ symlink://${platformio.packages_dir}/framework-espidf-v6.1
    platformio/toolchain-riscv32-esp@15.2.0+20251204
build_unflags = ${env.build_unflags} -std=gnu++23 -std=gnu++26
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.c6_idf61

[env:s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

[env:s3_lcd7]
extends = env:s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.s3_lcd7
board_build.cmake_extra_args = -DNABTOOLS_LCD7=ON -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.s3_lcd7.defaults"
